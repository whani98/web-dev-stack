<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script>
        function send(f){

           // alert(f.title.value + "/" + f.description.value + "/" + f.member_id.value);
           f.submit();
        }
    </script>
</head>
<body>
<h1 align="center">새 글 작성</h1>
<form th:action="@{/add}" method="post">
    <input type="hidden" th:value="${member_id}" name="member_id">
    <table border="1" align="center">
        <tr>
            <th>제목</th>
            <td><input name="title"/></td>
        </tr>
        <tr>
            <th>내용</th>
            <td><textarea name="description" rows="5" cols="50"></textarea></td>
        </tr>
    </table>
    <div align="center">
        <input type="button" value="목록으로" th:onclick="|history.back()|">
        <input type="button" value="등록" th:onclick="send(this.form)">
    </div>
</form>
</body>
</html>
